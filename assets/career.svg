<svg xmlns="http://www.w3.org/2000/svg" width="640" height="988" viewBox="0 0 640 988">
<defs><style>
  .m { font: 600 13px 'JetBrains Mono','Fira Code',Consolas,monospace; }
  .s { font: 500 11px 'JetBrains Mono','Fira Code',Consolas,monospace; fill: #6f7a99; letter-spacing: .3px; }
  .t { font: 600 12px 'JetBrains Mono',Consolas,monospace; fill: #7c8aa5; }
  .h { font: 700 12px 'JetBrains Mono',Consolas,monospace; fill: #a66bff; letter-spacing: 2px; }
  path { fill: none; stroke-width: 3; stroke-linecap: round; }
  .trunk { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: drawUp 3.36s .3s linear forwards; }
  .br { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.1s ease-out forwards; }
  .fut { opacity: 0; animation: fade .6s 3.38s forwards, dash 1s linear 3.98s infinite; }
  .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
  .row { opacity: 0; animation: slide .45s ease-out forwards; }
  .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 1.8s 3.22s ease-out infinite; }
  .fill { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
  .pctx { opacity: 0; animation: fade .4s forwards; }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes drawUp { to { stroke-dashoffset: 0 } }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  @keyframes dash { to { stroke-dashoffset: -20 } }
  @keyframes fade { to { opacity: 1 } }
  @keyframes pop { from { opacity: 0; transform: scale(0) } to { opacity: 1; transform: scale(1) } }
  @keyframes slide { from { opacity: 0; transform: translateX(-14px) } to { opacity: 1; transform: none } }
  @keyframes ring { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }
  @keyframes grow { to { transform: scaleX(1) } }
  @keyframes blink { 50% { opacity: 0 } }
</style>
